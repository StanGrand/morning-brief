<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real estate map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="">
<style>
  /* Minimal design (2026-10-29), same tokens and rules as the Daily Brief:
     Graphite neutrals, hairlines instead of shadows, sentence case, one red
     accent. Markers are colour-coded by kind (user request 2026-10-29):
     house red, plot blue, recreational green - the brief's own accent / blue /
     green values for each theme. */
  :root {
    --bg:#fafafa; --card:#ffffff; --ink:#0d0d0d; --muted:#6a6a6a;
    --accent:#d6220d; --border:rgba(0,0,0,.075); --hair:#e6e6e6; --cell:#f4f4f4;
    --house:#d6220d; --plot:#2563b8; --rec:#1a7f4b;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) {
    --bg:#0b0b0b; --card:#151515; --ink:#f5f5f5; --muted:#9b9b9b;
    --accent:#ff4b33; --border:rgba(255,255,255,.08); --hair:#262626; --cell:#1c1c1c;
    --house:#ff4b33; --plot:#60a5fa; --rec:#5ed88a;
  } }
  :root[data-theme="dark"] {
    --bg:#0b0b0b; --card:#151515; --ink:#f5f5f5; --muted:#9b9b9b;
    --accent:#ff4b33; --border:rgba(255,255,255,.08); --hair:#262626; --cell:#1c1c1c;
    --house:#ff4b33; --plot:#60a5fa; --rec:#5ed88a;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font:15px/1.45 var(--body); color:var(--ink); background:var(--bg); overflow:hidden;
    -webkit-font-smoothing:antialiased; }

  /* masthead: the brief's wordmark is the way back */
  header {
    position:fixed; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; flex-wrap:wrap; gap:10px 18px;
    padding:14px max(20px, env(safe-area-inset-right,0px)) 14px max(20px, env(safe-area-inset-left,0px));
    background:var(--bg); border-bottom:1px solid var(--hair);
  }
  .backlink { display:inline-flex; align-items:center; gap:9px; color:var(--ink); text-decoration:none;
    font:600 1.15rem/1.1 var(--body); letter-spacing:-.02em; white-space:nowrap; }
  .backlink:hover { opacity:.75; }
  .brand-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; }
  header h1 { font:400 .95rem/1.2 var(--body); color:var(--muted); margin:0; letter-spacing:0; }
  header h1::before { content:"/"; margin-right:12px; opacity:.5; }
  #search {
    flex:0 1 280px; min-width:140px; margin-left:auto; padding:7px 14px; border-radius:999px;
    border:1px solid var(--hair); background:var(--card); color:var(--ink);
    font:inherit; font-size:.9rem; outline:none; transition:border-color .12s;
  }
  #search::placeholder { color:var(--muted); }
  #search:focus { border-color:var(--ink); }
  #search:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  header .sub { color:var(--muted); font-size:.86rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .theme-btn {
    width:32px; height:32px; border-radius:50%; border:1px solid transparent; padding:0;
    background:transparent; color:var(--muted); cursor:pointer; display:inline-flex;
    align-items:center; justify-content:center; font:400 1rem/1 var(--body);
  }
  .theme-btn:hover { color:var(--ink); border-color:var(--hair); }
  @media (max-width:640px) {
    header { gap:8px 12px; }
    header h1 { display:none; }
    #search { flex:1 1 100%; order:3; margin-left:0; }
    .sub { margin-left:auto; }
  }

  #map { position:fixed; top:var(--head,61px); left:0; right:0; bottom:0; }
  .leaflet-container { background:var(--bg); font:inherit; }

  /* controls: hairline, no shadow */
  .leaflet-bar, .leaflet-touch .leaflet-bar { border:1px solid var(--hair) !important; box-shadow:none !important;
    border-radius:10px; overflow:hidden; }
  .leaflet-bar a, .leaflet-bar a:hover { background:var(--card); color:var(--ink); border-bottom:1px solid var(--hair);
    width:32px; height:32px; line-height:30px; font:400 18px/30px var(--body); }
  .leaflet-bar a:last-child { border-bottom:0; }
  .leaflet-bar a:hover { background:var(--cell); }
  .leaflet-bar a.leaflet-disabled { color:var(--muted); opacity:.5; background:var(--card); }
  .leaflet-control-attribution { font-size:10px !important; background:color-mix(in srgb, var(--bg) 80%, transparent) !important;
    color:var(--muted) !important; }
  .leaflet-control-attribution a { color:var(--muted) !important; }

  /* popups: a small hairline card */
  .leaflet-popup-content-wrapper { border-radius:12px; box-shadow:none; border:1px solid var(--hair);
    background:var(--card); color:var(--ink); }
  .leaflet-popup-tip { background:var(--card); box-shadow:none; border:1px solid var(--hair); }
  .leaflet-popup-content { margin:14px 16px; min-width:210px; max-width:280px; color:var(--ink); line-height:1.4; }
  .leaflet-container a.leaflet-popup-close-button { color:var(--muted); font:400 18px/24px var(--body); width:24px; height:24px;
    top:6px; right:6px; border-radius:50%; background:color-mix(in srgb, var(--card) 85%, transparent); z-index:2; }
  .leaflet-container a.leaflet-popup-close-button:hover { color:var(--ink); }
  .popup-title { font-weight:600; font-size:.95rem; margin:0 18px 4px 0; letter-spacing:-.01em; }
  .popup-meta { color:var(--muted); font-size:.8rem; margin:0 0 10px; }
  .popup-img { display:block; margin:-14px -16px 12px; height:150px; overflow:hidden;
    border-radius:11px 11px 0 0; background:var(--cell); }
  .popup-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .popup-approx { color:var(--muted); font-size:.76rem; margin:-6px 0 10px; font-style:italic; }
  .popup-row { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .popup-price { font-weight:600; font-size:1rem; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .popup-price .pm2 { font-weight:400; font-size:.8rem; color:var(--muted); margin-left:6px; }
  .leaflet-container a.popup-link { color:var(--ink); font-size:.86rem; text-decoration:underline;
    text-decoration-color:var(--hair); text-underline-offset:3px; white-space:nowrap; }
  .leaflet-container a.popup-link:hover { text-decoration-color:var(--ink); }

  /* markers: one colour per kind */
  .price-marker { background:transparent !important; border:none !important; }
  .pm { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; transform:translate(-5px,-6px); }
  .pm-dot { width:11px; height:11px; border-radius:50%; flex:none; box-sizing:border-box;
    background:var(--house); border:2px solid var(--card); box-shadow:0 0 0 1px var(--house); }
  .k-plot .pm-dot { background:var(--plot); box-shadow:0 0 0 1px var(--plot); }
  .k-rec .pm-dot { background:var(--rec); box-shadow:0 0 0 1px var(--rec); }
  .pm-price { background:var(--card); color:var(--ink); border:1px solid var(--hair); border-radius:6px;
    padding:1px 5px; font:600 10px/1.4 var(--body); font-variant-numeric:tabular-nums; }
  /* price cut: green label; saved: a star on the dot (2026-10-30) */
  :root { --ok:#1a7f4b; --star:#c28a00; }
  @media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) { --ok:#5ed88a; --star:#f5c542; } }
  :root[data-theme="dark"] { --ok:#5ed88a; --star:#f5c542; }
  .pm.cut .pm-price { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, var(--hair)); }
  .pm-star { color:var(--star); font:700 13px/1 var(--body); margin-left:-2px; text-shadow:0 0 2px var(--card); }
  .popup-price s, .row-price s { color:var(--muted); font-weight:400; font-size:.78rem; margin-left:6px; }
  .cutpct { color:var(--ok); font-weight:600; font-size:.8rem; margin-left:6px; white-space:nowrap; }
  .popup-price { white-space:nowrap; }
  .row-price .cutpct { display:block; margin:3px 0 0; }
  .pop-acts { display:flex; gap:6px; margin-top:12px; padding-top:10px; border-top:1px solid var(--hair); }
  .act { border:1px solid var(--hair); background:var(--card); color:var(--ink); border-radius:999px;
    font:500 .78rem/1 var(--body); padding:6px 10px; cursor:pointer; display:inline-flex; gap:5px; align-items:center; }
  .act:hover { border-color:var(--ink); }
  .act[aria-pressed="true"].fav { color:var(--star); border-color:var(--star); }
  .row-acts { display:flex; gap:4px; margin-top:6px; }
  .row-acts .act { padding:4px 8px; font-size:.72rem; }
  .row.is-hidden { opacity:.55; }
  /* the marker whose popup is open: bigger, ink ring */
  .pm.on .pm-dot { width:15px; height:15px; box-shadow:0 0 0 2px var(--ink); }
  .pm.on .pm-price { border-color:var(--ink); }

  .price-cluster { display:flex; align-items:center; justify-content:center;
    background:var(--card); color:var(--ink); border:1px solid var(--hair); border-radius:50%;
    font:600 12px/1 var(--body); font-variant-numeric:tabular-nums; box-shadow:none; }
  .price-cluster:hover { border-color:var(--ink); }

  /* filter bar (2026-10-30): the colour legend doubles as type toggles, plus
     a max price and "new this week". Same pill language as the panel. */
  .legend {
    position:fixed; bottom:16px; left:16px; z-index:1000; max-width:calc(100vw - 32px);
    background:var(--card); border:1px solid var(--hair); border-radius:12px; padding:5px;
    font-size:.8rem; color:var(--muted); display:flex; align-items:center; flex-wrap:wrap; gap:2px;
  }
  .legend .pm { transform:none; }
  .legend .sep { width:1px; align-self:stretch; background:var(--hair); margin:4px 4px; }
  .fbtn { border:0; background:none; color:var(--muted); font:500 .8rem/1 var(--body); padding:7px 10px;
    border-radius:999px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
  .fbtn:hover { color:var(--ink); }
  .fbtn[aria-pressed="true"] { color:var(--ink); }
  .fbtn.kind[aria-pressed="false"] { text-decoration:line-through; text-decoration-color:var(--muted); }
  .fbtn.kind[aria-pressed="false"] .pm-dot { background:transparent; }
  .fbtn.new[aria-pressed="true"] { background:var(--cell); box-shadow:0 0 0 1px var(--hair); }
  .fbtn:focus-visible, #maxPrice:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  #maxPrice { appearance:none; -webkit-appearance:none; border:0; background:none; color:var(--muted);
    font:500 .8rem/1 var(--body); padding:7px 10px; border-radius:999px; cursor:pointer; }
  #maxPrice:hover, #maxPrice.set { color:var(--ink); }
  #maxPrice.set { background:var(--cell); box-shadow:0 0 0 1px var(--hair); }
  #maxPrice option { background:var(--card); color:var(--ink); }
  .fbtn.reset { text-decoration:underline; text-decoration-color:var(--hair); text-underline-offset:3px; }
  .fbtn[hidden] { display:none; }
  @media (max-width:640px) { .legend { bottom:12px; left:8px; right:8px; max-width:none; } }

  /* zoomed out: dots and counts only, prices appear from zoom 14 */
  body.far .pm-price { display:none; }
  .price-cluster.hl { border-color:var(--ink); box-shadow:0 0 0 2px var(--ink); }

  /* list of stacked listings: side panel, bottom sheet on phones */
  #panel { position:fixed; z-index:1001; top:calc(var(--head, 61px) + 12px); right:12px; bottom:12px;
    width:min(380px, calc(100vw - 24px)); background:var(--card); border:1px solid var(--hair);
    border-radius:14px; display:flex; flex-direction:column; overflow:hidden; }
  #panel[hidden] { display:none; }
  .ph { display:flex; align-items:flex-start; gap:12px; padding:16px 14px 10px 18px; }
  .ph h2 { font:600 1rem/1.25 var(--body); margin:0; letter-spacing:-.01em; }
  .ph .where { color:var(--muted); font-size:.82rem; margin-top:2px; }
  .ph .x { margin-left:auto; flex:none; width:32px; height:32px; border-radius:50%; border:1px solid transparent;
    background:none; color:var(--muted); font:400 1.1rem/1 var(--body); cursor:pointer; }
  .ph .x:hover { color:var(--ink); border-color:var(--hair); }
  .pf { display:flex; flex-wrap:wrap; gap:4px; padding:0 18px 12px; border-bottom:1px solid var(--hair); }
  .pf:empty { padding-bottom:0; }
  .pf button { border:0; background:none; color:var(--muted); font:500 .8rem/1 var(--body); padding:6px 10px;
    border-radius:999px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
  .pf button:hover { color:var(--ink); }
  .pf button[aria-pressed="true"] { background:var(--cell); color:var(--ink); box-shadow:0 0 0 1px var(--hair); }
  .pf .pm, .row .pm { transform:none; }
  .pf .pm-dot { width:9px; height:9px; }
  #panelList { list-style:none; margin:0; padding:0 18px; overflow:auto; flex:1; overscroll-behavior:contain; }
  .row { display:grid; grid-template-columns:76px 1fr auto; column-gap:12px; padding:12px 0;
    border-bottom:1px solid var(--hair); align-items:start; }
  .thumb { position:relative; width:76px; height:57px; border-radius:8px; overflow:hidden; background:var(--cell); }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .pm { position:absolute; left:5px; top:5px; margin:0; }
  .thumb.none .pm { left:50%; top:50%; transform:translate(-50%,-50%); }
  .row:last-child { border-bottom:0; }
  .row .pm-dot { box-shadow:0 0 0 1px var(--card); }
  .row-title { color:var(--ink); font-weight:600; font-size:.88rem; line-height:1.3; text-decoration:none;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .row-title:hover { text-decoration:underline; text-decoration-color:var(--hair); text-underline-offset:3px; }
  .row-meta { color:var(--muted); font-size:.76rem; margin-top:3px; line-height:1.35; }
  .row-price { text-align:right; font-weight:600; font-size:.86rem; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .row-price .pm2 { display:block; font-weight:400; color:var(--muted); font-size:.74rem; margin-top:3px; }
  .row.focus { background:var(--cell); margin:0 -18px; padding:12px 18px; }
  .empty { color:var(--muted); font-size:.86rem; padding:16px 0; }
  @media (max-width:640px) {
    #panel { top:auto; left:0; right:0; bottom:0; width:auto; max-height:62vh;
      border-radius:14px 14px 0 0; border-width:1px 0 0; }
    body.panel-open .legend { display:none; }
  }
</style>
</head>
<body>
<header>
  <a class="backlink" href="index.html" title="Back to today's brief"><span class="brand-dot" aria-hidden="true"></span>Daily Brief</a>
  <h1>Real estate map</h1>
  <input id="search" type="search" placeholder="Search title or location…" aria-label="Search listings">
  <span class="sub" id="count">235 listings</span>
  <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle theme"></button>
</header>
<div id="map"></div>
<div class="legend" id="filters" role="group" aria-label="Filter listings">
  <button class="fbtn kind" type="button" data-kind="house" aria-pressed="true"><span class="pm k-house"><span class="pm-dot"></span></span>House</button>
  <button class="fbtn kind" type="button" data-kind="plot" aria-pressed="true"><span class="pm k-plot"><span class="pm-dot"></span></span>Plot</button>
  <button class="fbtn kind" type="button" data-kind="rec" aria-pressed="true"><span class="pm k-rec"><span class="pm-dot"></span></span>Recreational</button>
  <span class="sep" aria-hidden="true"></span>
  <select id="maxPrice" aria-label="Maximum price">
    <option value="0">Any price</option>
    <option value="100000">Up to 100k €</option>
    <option value="150000">Up to 150k €</option>
    <option value="200000">Up to 200k €</option>
    <option value="300000">Up to 300k €</option>
    <option value="500000">Up to 500k €</option>
  </select>
  <button class="fbtn new" type="button" id="newOnly" aria-pressed="false">New this week</button>
  <button class="fbtn new" type="button" id="cutOnly" aria-pressed="false">Price cut</button>
  <button class="fbtn new" type="button" id="favOnly" aria-pressed="false">&#9733; Saved</button>
  <button class="fbtn new" type="button" id="showHidden" aria-pressed="false" hidden>Hidden</button>
  <button class="fbtn reset" type="button" id="resetFilters" hidden>Reset</button>
</div>
<aside id="panel" hidden aria-labelledby="panelTitle">
  <div class="ph">
    <div><h2 id="panelTitle"></h2><div class="where" id="panelWhere"></div></div>
    <button class="x" id="panelClose" type="button" aria-label="Close list">&times;</button>
  </div>
  <div class="pf" id="panelFilters" role="group" aria-label="Filter by type"></div>
  <ul id="panelList"></ul>
</aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>

function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

const LIGHT_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}';
const DARK_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}';

// Labels-only layer made for the same canvas (town / village names), drawn
// above the base and below the markers.
const LIGHT_LABELS = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}';
const DARK_LABELS = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}';

let tileLayer = null;
let labelLayer = null;
const map = L.map('map', { zoomControl: true, maxZoom: 18 }).setView([48.20, 17.12], 12);
map.createPane('labels');
map.getPane('labels').style.zIndex = 450;          // above tiles (200), below markers (600)
map.getPane('labels').style.pointerEvents = 'none';
function applyTiles() {
  if (tileLayer) map.removeLayer(tileLayer);
  if (labelLayer) map.removeLayer(labelLayer);
  const dark = isDark();
  tileLayer = L.tileLayer(dark ? DARK_TILES : LIGHT_TILES, {
    maxZoom: 18, maxNativeZoom: 16, minZoom: 9,
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ'
  }).addTo(map);
  labelLayer = L.tileLayer(dark ? DARK_LABELS : LIGHT_LABELS, {
    maxZoom: 18, maxNativeZoom: 16, minZoom: 9, pane: 'labels'
  }).addTo(map);
}
applyTiles();

const markers = [];
function isPlot(d) { return /pozemok|záhrada|zahrada|plot|land/i.test(d.estate_type || ''); }
function priceLabel(p) {
  if (!p) return '';
  if (p >= 1000) return Math.round(p/1000) + 'k €';
  return p + ' €';
}
function kindClass(d) { return d.kind === 'r' ? 'k-rec' : (isPlot(d) ? 'k-plot' : 'k-house'); }
function markerIcon(kind, label, extra) {
  extra = extra || {};
  return L.divIcon({
    className: 'price-marker',
    html: '<span class="pm ' + kind + (extra.cut ? ' cut' : '') + '"><span class="pm-dot"></span>'
      + (extra.fav ? '<span class="pm-star" aria-label="saved">&#9733;</span>' : '')
      + (label ? '<span class="pm-price">' + (extra.cut ? '↓' : '') + label + '</span>' : '') + '</span>',
    iconSize: [0, 0],
    iconAnchor: [7, 10],
    popupAnchor: [0, -12]
  });
}
// ---- price cuts + saved / hidden listings (2026-10-30) ---------------------
// Cuts come from the brief's market history (price_was / price_cut_on). Saved
// and hidden marks are kept per browser in localStorage, keyed "b:<id>" /
// "r:<id>" like the deep links; they survive daily rebuilds.
function cutInfo(d) {
  if (!d.was || !d.price || d.price >= d.was) return null;
  const p = String(d.cut || '').split('-');
  return {
    old: d.was.toLocaleString('sk-SK') + ' €',
    pct: '−' + Math.round((d.was - d.price) / d.was * 100) + ' %',
    on: p.length === 3 ? (+p[2]) + '.' + (+p[1]) + '.' : ''
  };
}
const MKEY = 'mb-map-marks';
let marks = { fav: {}, hide: {} };
try {
  const raw = JSON.parse(localStorage.getItem(MKEY) || 'null');
  if (raw && raw.fav) marks.fav = raw.fav;
  if (raw && raw.hide) marks.hide = raw.hide;
} catch (e) {}
function isMarked(what, id) { return !!marks[what][id]; }
function toggleMark(what, id) {
  if (marks[what][id]) delete marks[what][id]; else marks[what][id] = 1;
  try { localStorage.setItem(MKEY, JSON.stringify(marks)); } catch (e) {}
}
function actsHtml(m) { return '<div class="pop-acts">' + actButtons(m) + '</div>'; }
function actButtons(m) {
  const fav = isMarked('fav', m._id), hid = isMarked('hide', m._id);
  return '<button type="button" class="act fav" data-act="fav" data-id="' + attr(m._id) + '" aria-pressed="' + fav + '">'
    + (fav ? '&#9733; Saved' : '&#9734; Save') + '</button>'
    + '<button type="button" class="act" data-act="hide" data-id="' + attr(m._id) + '" aria-pressed="' + hid + '">'
    + (hid ? 'Unhide' : 'Hide') + '</button>';
}
function refreshIcon(m) {
  m.setIcon(markerIcon(m._kindCls, m._priceLabel, { cut: !!m._was, fav: isMarked('fav', m._id) }));
}
const cluster = L.markerClusterGroup({
  maxClusterRadius: 40,
  spiderfyOnMaxZoom: false,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: false,
  iconCreateFunction: c => {
    const n = c.getChildCount();
    const size = n < 10 ? 30 : n < 100 ? 36 : 42;
    return L.divIcon({
      html: '<span>' + n + '</span>',
      className: 'price-cluster',
      iconSize: [size, size]
    });
  }
});
// A numbered circle zooms in while that separates its listings. When it
// cannot - the listings share (almost) one point, because the source only
// gives a village or a street - or the map is already close, it opens the
// list panel instead of a spiral of overlapping points.
const SAME_SPOT_M = 150;
cluster.on('clusterclick', e => {
  const c = e.layer;
  const b = c.getBounds();
  const span = b.getNorthEast().distanceTo(b.getSouthWest());
  if (span <= SAME_SPOT_M || map.getZoom() >= 16) { openPanel(c.getAllChildMarkers()); return; }
  map.fitBounds(b, { padding: [60, 60], maxZoom: 17 });
});
for (const d of DATA) {
  if (d.lat == null || d.lon == null) continue;
  const price = d.price ? (d.price.toLocaleString('sk-SK') + ' €') : 'Price on request';
  const area = d.area ? (Math.round(d.area).toLocaleString('sk-SK') + ' m²') : '';
  const pm2 = (d.price && d.area) ? Math.round(d.price / d.area).toLocaleString('sk-SK') + ' €/m²' : '';
  const meta = [d.location, d.estate_type, d.listed_date, area].filter(Boolean).join(' · ');
  const approx = d.geo === 'approx' ? '<div class="popup-approx">Approximate location: the listing names only the town</div>'
    : d.geo === 'postcode' ? '<div class="popup-approx">Approximate location: postcode area ' + esc(d.psc) + '</div>' : '';
  const photo = d.img ? '<a class="popup-img" href="' + attr(d.url || '#') + '" target="_blank" rel="noopener" tabindex="-1">'
    + '<img src="' + attr(d.img) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></a>' : '';
  const was = cutInfo(d);
  const head = photo + '<div class="popup-title">' + esc(d.title) + '</div>'
    + '<div class="popup-meta">' + esc(meta) + '</div>' + approx
    + '<div class="popup-row"><div class="popup-price">' + price
    + (was ? '<s title="Before the price cut on ' + esc(was.on) + '">' + esc(was.old) + '</s><span class="cutpct">' + esc(was.pct) + '</span>' : '')
    + (pm2 && !was ? '<span class="pm2">' + pm2 + '</span>' : '') + '</div>'
    + (d.url ? '<a class="popup-link" href="' + attr(d.url) + '" target="_blank" rel="noopener">Open listing ↗</a>' : '')
    + '</div>';
  const kind = kindClass(d);
  const m = L.marker([d.lat, d.lon], { icon: markerIcon(kind, priceLabel(d.price), { cut: !!was }) });
  m.bindPopup(() => head + actsHtml(m));
  m.on('popupopen', () => { const el = m._icon && m._icon.querySelector('.pm'); if (el) el.classList.add('on'); });
  m.on('popupclose', () => { const el = m._icon && m._icon.querySelector('.pm'); if (el) el.classList.remove('on'); });
  m._id = (d.kind || 'b') + ':' + d.id; m._kind = d.kind || 'b'; m._title = d.title; m._location = d.location; m._isPlot = isPlot(d);
  m._priceLabel = priceLabel(d.price);
  m._d = d; m._price = price; m._pm2 = pm2; m._area = area; m._was = was; m._kindCls = kind;
  if (isMarked('fav', m._id)) refreshIcon(m);
  cluster.addLayer(m);
  markers.push(m);
}
map.addLayer(cluster);

// ---- filters: search + type toggles + max price + new this week ----------
// One predicate (passes) drives the map, the counter and the list panel.
// The choice is remembered per browser (localStorage, best effort).
const searchInput = document.getElementById('search');
const countEl = document.getElementById('count');
const totalN = markers.length;
const FKEY = 'mb-map-filters';
let filtersReady = false;
const flt = { kinds: { house: true, plot: true, rec: true }, max: 0, fresh: false, cut: false, fav: false, hidden: false };
try {
  const saved = JSON.parse(localStorage.getItem(FKEY) || 'null');
  if (saved && saved.kinds) Object.assign(flt.kinds, saved.kinds);
  if (saved && saved.max) flt.max = +saved.max || 0;
  if (saved && saved.fresh) flt.fresh = true;
  if (saved && saved.cut) flt.cut = true;
  if (saved && saved.fav) flt.fav = true;
} catch (e) {}
function saveFilters() {
  try { localStorage.setItem(FKEY, JSON.stringify(Object.assign({}, flt, { hidden: false }))); } catch (e) {}
}
const WEEK_AGO = (() => { const t = new Date(); t.setDate(t.getDate() - 7);
  return t.getFullYear() * 10000 + (t.getMonth() + 1) * 100 + t.getDate(); })();
function filtersActive() {
  return !flt.kinds.house || !flt.kinds.plot || !flt.kinds.rec || flt.max > 0 || flt.fresh
    || flt.cut || flt.fav || flt.hidden;
}
// Listings without a price ("Dohodou", on request) stay visible under a max
// price: unknown is not over budget.
function passes(m, nq) {
  if (nq && !norm(m._title + ' ' + m._location).includes(nq)) return false;
  if (!flt.kinds[kindOf(m)]) return false;
  if (flt.max && m._d.price && m._d.price > flt.max) return false;
  if (flt.fresh && dateKey(m) < WEEK_AGO) return false;
  if (flt.cut && !m._was) return false;
  if (flt.fav && !isMarked('fav', m._id)) return false;
  // Hidden listings disappear unless "Hidden" is on, which shows only them.
  if (isMarked('hide', m._id) !== flt.hidden) return false;
  return true;
}
function applyFilter(fit) {
  const nq = norm(searchInput.value);
  const keep = [], drop = [];
  for (const m of markers) (passes(m, nq) ? keep : drop).push(m);
  cluster.removeLayers(drop);
  cluster.addLayers(keep.filter(m => !cluster.hasLayer(m)));
  const any = nq || filtersActive() || keep.length !== totalN;
  if (countEl) countEl.textContent = any ? (keep.length + ' of ' + totalN + ' listings') : (totalN + ' listings');
  // Re-centre on the results when asked (search, type toggles, reset) or when
  // none is well inside the view (edges and the filter bar do not count).
  const view = map.getBounds().pad(-0.12);
  if (keep.length && (fit || (filtersReady && !keep.some(m => view.contains(m.getLatLng())))))
    map.fitBounds(cluster.getBounds(), { padding:[40,40], maxZoom:16 });
  syncFilterUi();
  if (!panel.hidden) renderPanel();
}
const filterBar = document.getElementById('filters');
const maxSel = document.getElementById('maxPrice');
const newBtn = document.getElementById('newOnly');
const resetBtn = document.getElementById('resetFilters');
const cutBtn = document.getElementById('cutOnly');
const favBtn = document.getElementById('favOnly');
const hidBtn = document.getElementById('showHidden');
function syncFilterUi() {
  for (const b of filterBar.querySelectorAll('.fbtn.kind'))
    b.setAttribute('aria-pressed', String(!!flt.kinds[b.getAttribute('data-kind')]));
  maxSel.value = String(flt.max);
  maxSel.classList.toggle('set', flt.max > 0);
  newBtn.setAttribute('aria-pressed', String(flt.fresh));
  cutBtn.setAttribute('aria-pressed', String(flt.cut));
  cutBtn.hidden = !markers.some(m => m._was);
  favBtn.setAttribute('aria-pressed', String(flt.fav));
  const nHidden = markers.filter(m => isMarked('hide', m._id)).length;
  if (!nHidden && flt.hidden) flt.hidden = false;
  hidBtn.hidden = !nHidden;
  hidBtn.textContent = 'Hidden ' + nHidden;
  hidBtn.setAttribute('aria-pressed', String(flt.hidden));
  resetBtn.hidden = !filtersActive();
}
filterBar.addEventListener('click', e => {
  const b = e.target.closest('.fbtn.kind');
  if (!b) return;
  const k = b.getAttribute('data-kind');
  flt.kinds[k] = !flt.kinds[k];
  // Never all off: turning off the last type shows only that one instead.
  if (!flt.kinds.house && !flt.kinds.plot && !flt.kinds.rec) {
    flt.kinds = { house: false, plot: false, rec: false }; flt.kinds[k] = true;
  }
  saveFilters(); applyFilter(true);
});
maxSel.addEventListener('change', () => { flt.max = +maxSel.value || 0; saveFilters(); applyFilter(false); });
newBtn.addEventListener('click', () => { flt.fresh = !flt.fresh; saveFilters(); applyFilter(false); });
cutBtn.addEventListener('click', () => { flt.cut = !flt.cut; saveFilters(); applyFilter(false); });
favBtn.addEventListener('click', () => { flt.fav = !flt.fav; saveFilters(); applyFilter(true); });
hidBtn.addEventListener('click', () => { flt.hidden = !flt.hidden; applyFilter(true); });

// Save / Hide buttons (popup and list rows). A hidden listing leaves the map
// at once; a saved one gets a star.
document.addEventListener('click', e => {
  const b = e.target.closest('.act[data-act]');
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const id = b.getAttribute('data-id'), what = b.getAttribute('data-act');
  const m = markers.find(x => x._id === id);
  if (!m) return;
  toggleMark(what, id);
  if (what === 'fav') {
    refreshIcon(m);
    if (m.isPopupOpen()) m.getPopup().update();
  } else {
    m.closePopup();
  }
  applyFilter(false);
}, true);
resetBtn.addEventListener('click', () => {
  flt.kinds = { house: true, plot: true, rec: true }; flt.max = 0; flt.fresh = false;
  flt.cut = false; flt.fav = false; flt.hidden = false;
  saveFilters(); applyFilter(true);
});
searchInput.addEventListener('input', () => applyFilter(!!searchInput.value.trim()));

// Deep-link: reality_map.html#b:<id> / #r:<id> zooms to that point and opens it.
function zoomToId(id) {
  const m = markers.find(x => x._id === id);
  if (!m) return false;
  // A link to one listing wins over saved filters that would hide it.
  if (!passes(m, '')) {
    flt.kinds = { house: true, plot: true, rec: true }; flt.max = 0; flt.fresh = false;
    flt.cut = false; flt.fav = false; flt.hidden = isMarked('hide', m._id);
    if (filtersReady) applyFilter(false);
  }
  map.setView(m.getLatLng(), 17, { animate: false });
  setTimeout(() => {
    const v = cluster.getVisibleParent(m);
    if (!v || v === m) m.openPopup();
    else openPanel(v.getAllChildMarkers(), m);
  }, 300);
  return true;
}
function handleHash() {
  const id = decodeURIComponent(location.hash.replace(/^#/, ''));
  return id ? zoomToId(id) : false;
}
window.addEventListener('hashchange', handleHash);
if (!handleHash() && markers.length) {
  map.fitBounds(cluster.getBounds(), { padding: [40, 40], maxZoom: 14, animate: false });
}

// ---- list panel --------------------------------------------------------
const panel = document.getElementById('panel');
const panelTitle = document.getElementById('panelTitle');
const panelWhere = document.getElementById('panelWhere');
const panelFilters = document.getElementById('panelFilters');
const panelList = document.getElementById('panelList');
const KIND_NAME = { house: 'House', plot: 'Plot', rec: 'Recreational' };
let panelMarkers = [];
let panelKind = 'all';
function kindOf(m) { return m._kind === 'r' ? 'rec' : (m._isPlot ? 'plot' : 'house'); }
function dateKey(m) {
  const p = String(m._d.listed_date || '').split('.').map(Number);
  return (p[2] || 0) * 10000 + (p[1] || 0) * 100 + (p[0] || 0);
}
function placeName(ms) {
  const n = {};
  for (const m of ms) if (m._location) n[m._location] = (n[m._location] || 0) + 1;
  const top = Object.entries(n).sort((a, b) => b[1] - a[1]);
  if (!top.length) return '';
  return top[0][0] + (top.length > 1 ? ' and nearby' : '');
}
function openPanel(ms, focus) {
  map.closePopup();
  panelMarkers = ms.slice().sort((a, b) => dateKey(b) - dateKey(a) || (+b._d.id || 0) - (+a._d.id || 0));
  panelKind = 'all';
  panel.hidden = false;
  document.body.classList.add('panel-open');
  renderPanel(focus);
}
function closePanel() {
  if (panel.hidden) return;
  panel.hidden = true;
  document.body.classList.remove('panel-open');
  unhighlight();
  panelMarkers = [];
}
function renderPanel(focus) {
  const q = norm(searchInput.value);
  const vis = panelMarkers.filter(m => passes(m, q));
  const counts = { house: 0, plot: 0, rec: 0 };
  for (const m of vis) counts[kindOf(m)]++;
  const kinds = Object.keys(counts).filter(k => counts[k]);
  if (panelKind !== 'all' && !counts[panelKind]) panelKind = 'all';
  const rows = vis.filter(m => panelKind === 'all' || kindOf(m) === panelKind);
  panelTitle.textContent = vis.length + (vis.length === 1 ? ' listing' : ' listings');
  panelWhere.textContent = placeName(panelMarkers);
  panelFilters.innerHTML = kinds.length < 2 ? '' :
    '<button type="button" data-k="all" aria-pressed="' + (panelKind === 'all') + '">All ' + vis.length + '</button>'
    + kinds.map(k => '<button type="button" data-k="' + k + '" aria-pressed="' + (panelKind === k) + '">'
      + '<span class="pm k-' + k + '"><span class="pm-dot"></span></span>' + KIND_NAME[k] + ' ' + counts[k] + '</button>').join('');
  panelList.innerHTML = rows.length ? rows.map(m => {
    const d = m._d;
    const where = d.location + (d.geo === 'approx' ? ' (approx.)' : d.geo === 'postcode' ? ' (PSČ ' + d.psc + ')' : '');
    const meta = [where, d.estate_type, d.listed_date, m._area].filter(Boolean).join(' · ');
    const dot = '<span class="pm k-' + kindOf(m) + '"><span class="pm-dot"></span></span>';
    const thumb = d.img
      ? '<span class="thumb">' + '<img src="' + attr(d.img) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' + dot + '</span>'
      : '<span class="thumb none">' + dot + '</span>';
    return '<li class="row' + (focus === m ? ' focus' : '') + '" data-id="' + attr(m._id) + '">'
      + thumb
      + '<div><a class="row-title" href="' + attr(d.url || '#') + '" target="_blank" rel="noopener" title="' + attr(d.title) + '">' + esc(d.title) + ' ↗</a>'
      + '<div class="row-meta">' + esc(meta) + '</div>'
      + '<div class="row-acts">' + actButtons(m) + '</div></div>'
      + '<div class="row-price">' + (isMarked('fav', m._id) ? '<span class="pm-star">&#9733;</span> ' : '')
      + (d.price ? esc(m._price) : 'On request')
      + (m._was ? '<span class="cutpct" title="Was ' + attr(m._was.old) + ', cut on ' + attr(m._was.on) + '">' + esc(m._was.pct) + '</span>' : '')
      + (m._pm2 && !m._was ? '<span class="pm2">' + esc(m._pm2) + '</span>' : '') + '</div></li>';
  }).join('') : (flt.hidden ? '<li class="empty">No hidden listings here.</li>' : '<li class="empty">No listings match the search or filters.</li>');
  const f = panelList.querySelector('.row.focus');
  if (f) f.scrollIntoView({ block: 'center' });
  else panelList.scrollTop = 0;
}
panelFilters.addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  panelKind = b.getAttribute('data-k');
  renderPanel();
});
// Hovering a row marks where it is: its own marker, or the circle it sits in.
let lit = null;
function unhighlight() {
  if (lit) lit.classList.remove('hl', 'on');
  lit = null;
}
function highlight(m) {
  unhighlight();
  const v = cluster.getVisibleParent(m);
  if (!v || !v._icon) return;
  lit = v === m ? v._icon.querySelector('.pm') : v._icon;
  if (lit) lit.classList.add(v === m ? 'on' : 'hl');
}
panelList.addEventListener('mouseover', e => {
  const r = e.target.closest('.row');
  const m = r && markers.find(x => x._id === r.getAttribute('data-id'));
  if (m) highlight(m);
});
panelList.addEventListener('mouseleave', unhighlight);
document.getElementById('panelClose').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
map.on('click', closePanel);

// Saved filters apply on load (the markers were all added above).
applyFilter(false);
filtersReady = true;

// Prices on the markers only from zoom 14; further out they just collide.
function updateFar() { document.body.classList.toggle('far', map.getZoom() < 14); }
map.on('zoomend', updateFar);
updateFar();

function esc(s) { return String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function attr(s) { return String(s||'').replace(/"/g,'&quot;'); }
function norm(s) {
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

// Theme handling, shared key with the Daily Brief.
const KEY = 'mb-theme';
const btn = document.getElementById('themeBtn');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  btn.textContent = t === 'dark' ? '☀︎' : '☾︎';
  applyTiles();
}
const stored = localStorage.getItem(KEY);
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(stored || (prefersDark ? 'dark' : 'light'));
btn.addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  localStorage.setItem(KEY, next);
  applyTheme(next);
});

// This page is also published as archive/reality_map.html (so archived briefs
// do not 404); one level up from there the back link needs a ../ prefix.
function fitHead() {
  const h = document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--head', h + 'px');
  map.invalidateSize();
}
window.addEventListener('resize', fitHead);
fitHead();

if (location.pathname.indexOf('/archive/') !== -1) {
  const back = document.querySelector('header a.backlink');
  if (back) back.setAttribute('href', '../index.html');
}
</script>
</body>
