<style>

  @media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) {
    --bg:#0b0b0b; --card:#151515; --ink:#f5f5f5; --muted:#9b9b9b;
    --accent:#ff4b33; --hair:#262626; --cell:#1c1c1c; --ok:#5ed88a; --home:#60a5fa;
  } }
  :root[data-theme="dark"] {
    --bg:#0b0b0b; --card:#151515; --ink:#f5f5f5; --muted:#9b9b9b;
    --accent:#ff4b33; --hair:#262626; --cell:#1c1c1c; --ok:#5ed88a; --home:#60a5fa;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font:15px/1.45 var(--body); color:var(--ink); background:var(--bg); overflow:hidden;
    -webkit-font-smoothing:antialiased; }
  header { position:fixed; top:0; left:0; right:0; z-index:1000; display:flex; align-items:center;
    flex-wrap:wrap; gap:10px 18px; background:var(--bg); border-bottom:1px solid var(--hair);
    padding:14px max(20px, env(safe-area-inset-right,0px)) 14px max(20px, env(safe-area-inset-left,0px)); }
  .backlink { display:inline-flex; align-items:center; gap:9px; color:var(--ink); text-decoration:none;
    font:600 1.15rem/1.1 var(--body); letter-spacing:-.02em; white-space:nowrap; }
  .backlink:hover { opacity:.75; }
  .brand-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; }
  header h1 { font:400 .95rem/1.2 var(--body); color:var(--muted); margin:0; }
  header h1::before { content:"/"; margin-right:12px; opacity:.5; }
  #search { flex:0 1 280px; min-width:140px; margin-left:auto; padding:7px 14px; border-radius:999px;
    border:1px solid var(--hair); background:var(--card); color:var(--ink); font:inherit; font-size:.9rem; outline:none; }
  #search::placeholder { color:var(--muted); }
  #search:focus { border-color:var(--ink); }
  header .sub { color:var(--muted); font-size:.86rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .theme-btn { width:32px; height:32px; border-radius:50%; border:1px solid transparent; padding:0;
    background:transparent; color:var(--muted); cursor:pointer; font:400 1rem/1 var(--body); }
  .theme-btn:hover { color:var(--ink); border-color:var(--hair); }
  @media (max-width:640px) {
    header { gap:8px 12px; } header h1 { display:none; }
    #search { flex:1 1 100%; order:3; margin-left:0; } .sub { margin-left:auto; }
  }
  #map { position:fixed; top:var(--head,61px); left:0; right:0; bottom:0; }
  .leaflet-container { background:var(--bg); font:inherit; }
  .leaflet-bar, .leaflet-touch .leaflet-bar { border:1px solid var(--hair) !important; box-shadow:none !important;
    border-radius:10px; overflow:hidden; }
  .leaflet-bar a, .leaflet-bar a:hover { background:var(--card); color:var(--ink); border-bottom:1px solid var(--hair);
    width:32px; height:32px; font:400 18px/30px var(--body); }
  .leaflet-bar a:last-child { border-bottom:0; }
  .leaflet-control-attribution { font-size:10px !important; background:color-mix(in srgb, var(--bg) 80%, transparent) !important;
    color:var(--muted) !important; }
  .leaflet-control-attribution a { color:var(--muted) !important; }
  .leaflet-popup-content-wrapper { border-radius:12px; box-shadow:none; border:1px solid var(--hair);
    background:var(--card); color:var(--ink); }
  .leaflet-popup-tip { background:var(--card); box-shadow:none; border:1px solid var(--hair); }
  .leaflet-popup-content { margin:14px 16px; min-width:220px; max-width:290px; line-height:1.4; }
  .leaflet-container a.leaflet-popup-close-button { color:var(--muted); font:400 18px/24px var(--body); width:24px; height:24px;
    top:6px; right:6px; border-radius:50%; background:color-mix(in srgb, var(--card) 85%, transparent); z-index:2; }
  .popup-img { display:block; margin:-14px -16px 12px; height:150px; overflow:hidden; border-radius:11px 11px 0 0; background:var(--cell); }
  .popup-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .popup-title { font-weight:600; font-size:.95rem; margin:0 18px 2px 0; letter-spacing:-.01em; }
  .popup-meta, .popup-approx { color:var(--muted); font-size:.8rem; margin:0 0 8px; }
  .popup-approx { font-style:italic; margin-top:-4px; font-size:.76rem; }
  .popup-text { font-size:.86rem; margin:0 0 8px; max-height:9.5em; overflow:auto; overflow-wrap:anywhere; }
  .verdict { font-weight:600; font-size:.8rem; }
  .verdict.yes { color:var(--ok); } .verdict.no { color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:.78rem; color:var(--muted); margin:0 0 10px; }
  .leaflet-container a.popup-link { color:var(--ink); font-size:.84rem; text-decoration:underline;
    text-decoration-color:var(--hair); text-underline-offset:3px; }
  .leaflet-container a.popup-link:hover { text-decoration-color:var(--ink); }
  .links { display:flex; gap:14px; flex-wrap:wrap; }

  .mk { background:transparent !important; border:none !important; }
  .dot { display:block; width:12px; height:12px; border-radius:50%; transform:translate(-6px,-6px);
    background:var(--ok); border:2px solid var(--card); box-shadow:0 0 0 1px var(--ok); }
  .dot.no { background:var(--card); border:2px solid var(--muted); box-shadow:0 0 0 1px var(--card); }
  .dot.age1 { opacity:.75; } .dot.age2 { opacity:.45; }
  .dot.on { width:16px; height:16px; transform:translate(-8px,-8px); box-shadow:0 0 0 2px var(--ink); }
  .home-dot { display:block; width:10px; height:10px; border-radius:50%; background:var(--home); border:2px solid var(--card);
    box-shadow:0 0 0 1px var(--home); transform:translate(-5px,-5px); }
  .clu { display:flex; align-items:center; justify-content:center; border-radius:50%;
    background:var(--card); color:var(--ink); border:1px solid var(--hair); font:600 12px/1 var(--body);
    font-variant-numeric:tabular-nums; }
  .clu.some { border-color:var(--ok); box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--ok) 35%, transparent); }
  .clu:hover, .clu.hl { border-color:var(--ink); }

  .legend { position:fixed; bottom:16px; left:16px; z-index:1000; max-width:calc(100vw - 32px);
    background:var(--card); border:1px solid var(--hair); border-radius:12px; padding:5px;
    font-size:.8rem; color:var(--muted); display:flex; align-items:center; flex-wrap:wrap; gap:2px; }
  .legend .sep { width:1px; align-self:stretch; background:var(--hair); margin:4px; }
  .fbtn, .legend select { border:0; background:none; color:var(--muted); font:500 .8rem/1 var(--body);
    padding:7px 10px; border-radius:999px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
  .legend select { appearance:none; -webkit-appearance:none; }
  .legend select option { background:var(--card); color:var(--ink); }
  .fbtn:hover, .legend select:hover, .legend select.set { color:var(--ink); }
  .legend select.set { background:var(--cell); box-shadow:0 0 0 1px var(--hair); }
  .fbtn.kind[aria-pressed="false"] { text-decoration:line-through; }
  .fbtn .dot { transform:none; width:10px; height:10px; }
  .fbtn.reset { text-decoration:underline; text-decoration-color:var(--hair); text-underline-offset:3px; }
  .fbtn[hidden] { display:none; }
  .fbtn:focus-visible, .legend select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  @media (max-width:640px) { .legend { bottom:12px; left:8px; right:8px; max-width:none; } }

  #panel { position:fixed; z-index:1001; top:calc(var(--head, 61px) + 12px); right:12px; bottom:12px;
    width:min(380px, calc(100vw - 24px)); background:var(--card); border:1px solid var(--hair);
    border-radius:14px; display:flex; flex-direction:column; overflow:hidden; }
  #panel[hidden] { display:none; }
  .ph { display:flex; align-items:flex-start; gap:12px; padding:16px 14px 10px 18px; border-bottom:1px solid var(--hair); }
  .ph h2 { font:600 1rem/1.25 var(--body); margin:0; }
  .ph .where { color:var(--muted); font-size:.82rem; margin-top:2px; }
  .ph .x { margin-left:auto; flex:none; width:32px; height:32px; border-radius:50%; border:1px solid transparent;
    background:none; color:var(--muted); font:400 1.1rem/1 var(--body); cursor:pointer; }
  .ph .x:hover { color:var(--ink); border-color:var(--hair); }
  #panelList { list-style:none; margin:0; padding:0 18px; overflow:auto; flex:1; overscroll-behavior:contain; }
  .row { display:grid; grid-template-columns:64px 1fr; column-gap:12px; padding:12px 0; border-bottom:1px solid var(--hair); }
  .row:last-child { border-bottom:0; }
  .row.focus { background:var(--cell); margin:0 -18px; padding:12px 18px; }
  .thumb { position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; background:var(--cell);
    display:flex; align-items:center; justify-content:center; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .dot { position:absolute; left:5px; top:5px; transform:none; width:10px; height:10px; }
  .thumb.none .dot { position:static; }
  .row-title { font-weight:600; font-size:.88rem; line-height:1.3; }
  .row-meta { color:var(--muted); font-size:.76rem; margin-top:2px; }
  .row-text { font-size:.82rem; margin-top:4px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .row-links { margin-top:5px; display:flex; gap:12px; font-size:.78rem; }
  .row-links a, .row-links button { color:var(--muted); text-decoration:underline; text-decoration-color:var(--hair);
    text-underline-offset:3px; background:none; border:0; padding:0; font:inherit; cursor:pointer; }
  .row-links a:hover, .row-links button:hover { color:var(--ink); }
  .empty { color:var(--muted); font-size:.86rem; padding:16px 0; }

  /* growing conditions (2026-11-02): region pills on the map + a side panel */
  :root { --good:#1a7f4b; --fair:#b26a00; --poor:#8a8a8a; }
  @media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) { --good:#5ed88a; --fair:#f0a640; --poor:#8a8a8a; } }
  :root[data-theme="dark"] { --good:#5ed88a; --fair:#f0a640; --poor:#8a8a8a; }
  .rg { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; transform:translate(-50%,-50%);

  .rg i { width:8px; height:8px; border-radius:50%; background:var(--poor); }

  .rg.fair { border-color:color-mix(in srgb, var(--fair) 55%, var(--hair)); }

  #cond { position:fixed; z-index:1002; top:calc(var(--head, 61px) + 12px); right:12px; bottom:12px;

  table.rg-t { width:100%; border-collapse:collapse; font-size:.8rem; font-variant-numeric:tabular-nums; }
  .rg-t th { text-align:left; font-weight:500; color:var(--muted); padding:4px 4px 6px 0; font-size:.74rem; }
  .rg-t td { padding:6px 4px 6px 0; border-top:1px solid var(--hair); vertical-align:middle; }

  .rg-t .sc { font-weight:600; }
  .lv { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--poor); margin-right:6px; }
  .bars { display:inline-flex; align-items:flex-end; gap:1px; height:18px; }
  .bars span { width:3px; background:var(--home); opacity:.75; min-height:1px; }
  .tabs { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0 8px; }
  .tabs button { border:0; background:none; color:var(--muted); font:500 .78rem/1 var(--body); padding:6px 9px;
    border-radius:999px; cursor:pointer; }
  .tabs button[aria-pressed="true"] { background:var(--cell); color:var(--ink); box-shadow:0 0 0 1px var(--hair); }
  .shot { display:block; width:100%; border-radius:10px; border:1px solid var(--hair); background:var(--cell); min-height:120px; }
  .shot img { display:block; width:100%; height:auto; border-radius:10px; }

    #cond { top:auto; left:0; right:0; bottom:0; width:auto; max-height:72vh; border-radius:14px 14px 0 0; border-width:1px 0 0; }
    body.cond-open .legend { display:none; }
    .hbtn { padding:7px 10px; }
  }
  @media (max-width:640px) {
    #panel { top:auto; left:0; right:0; bottom:0; width:auto; max-height:62vh; border-radius:14px 14px 0 0; border-width:1px 0 0; }
    body.panel-open .legend { display:none; }
  }
</style>

function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

const LIGHT_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}';
const DARK_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}';
const LIGHT_LABELS = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}';
const DARK_LABELS = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}';
let tileLayer = null, labelLayer = null;
const map = L.map('map', { zoomControl: true, maxZoom: 18, minZoom: 6 }).setView([48.7, 19.5], 8);
map.createPane('labels');
map.getPane('labels').style.zIndex = 450;          // above tiles (200), below markers (600)
map.getPane('labels').style.pointerEvents = 'none';
function applyTiles() {
  if (tileLayer) map.removeLayer(tileLayer);
  if (labelLayer) map.removeLayer(labelLayer);
  const dark = isDark();
  tileLayer = L.tileLayer(dark ? DARK_TILES : LIGHT_TILES, {
    maxZoom: 18, maxNativeZoom: 16, minZoom: 6,
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ &middot; Reports: <a href="' + attr(CONF.source) + '">nahuby.sk</a>'
  }).addTo(map);
  labelLayer = L.tileLayer(dark ? DARK_LABELS : LIGHT_LABELS, {
    maxZoom: 18, maxNativeZoom: 16, minZoom: 6, pane: 'labels'
  }).addTo(map);
}
applyTiles();

const TODAY = new Date(CONF.today + 'T12:00:00');
function ageDays(d) { return Math.round((TODAY - new Date(d.date + 'T12:00:00')) / 864e5); }
function fmtDate(iso) {
  const p = String(iso || '').split('-');
  return p.length === 3 ? (+p[2]) + '. ' + (+p[1]) + '. ' + p[0] : iso;
}
function dotCls(d) { const a = ageDays(d); return 'dot' + (d.grew ? '' : ' no') + (a > 7 ? ' age2' : a > 3 ? ' age1' : ''); }
function icon(d, on) {
  return L.divIcon({ className: 'mk', html: '<span class="' + dotCls(d) + (on ? ' on' : '') + '"></span>', iconSize: [0, 0], popupAnchor: [0, -8] });
}
function title(d) { return [d.area, d.loc].filter(Boolean).join(' · '); }
function spNames(d) { return (d.sp || []).map(k => SPECIES[k] ? SPECIES[k][0] + ' (' + SPECIES[k][1] + ')' : k); }
function popupHtml(d) {
  const photo = d.img ? '<a class="popup-img" href="' + attr(d.photo || CONF.source) + '" target="_blank" rel="noopener" tabindex="-1">'
    + '<img src="' + attr(d.img) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></a>' : '';
  const meta = [fmtDate(d.date), d.user, d.km != null ? Math.round(d.km) + ' km from home' : ''].filter(Boolean).join(' · ');
  const approx = d.geo === 'area' ? '<div class="popup-approx">' + (d.loc ? 'Spot not found on the map: placed at ' : 'Placed at the region town ') + esc(d.area) + '</div>' : '';
  const sp = spNames(d);
  return photo + '<div class="popup-title">' + esc(title(d)) + '</div>'
    + '<div class="popup-meta">' + esc(meta) + '</div>' + approx
    + '<div class="popup-text"><span class="verdict ' + (d.grew ? 'yes">Found something' : 'no">Nothing grew') + '</span>'
    + (d.text ? ' — ' + esc(d.text) : '') + '</div>'
    + (sp.length ? '<div class="chips">' + sp.map(s => '<span>' + esc(s) + '</span>').join('') + '</div>' : '')
    + '<div class="links">' + (d.photo ? '<a class="popup-link" href="' + attr(d.photo) + '" target="_blank" rel="noopener">Photo on nahuby.sk ↗</a>' : '')
    + '<a class="popup-link" href="' + attr(CONF.source) + '" target="_blank" rel="noopener">All reports ↗</a></div>';
}

const cluster = L.markerClusterGroup({

});

cluster.on('clusterclick', e => {
  const b = e.layer.getBounds();
  const span = b.getNorthEast().distanceTo(b.getSouthWest());
  if (span <= SAME_SPOT_M || map.getZoom() >= 14) { openPanel(e.layer.getAllChildMarkers()); return; }
  map.fitBounds(b, { padding: [60, 60], maxZoom: 15 });
});
const markers = [];
const seenSp = {};
for (const d of DATA) {
  const m = L.marker([d.lat, d.lon], { icon: icon(d, false) });
  m._d = d; m._id = d.id;
  m._hay = norm([d.area, d.loc, d.user, d.text, spNames(d).join(' ')].join(' '));
  m.bindPopup(() => popupHtml(d), { maxWidth: 300 });
  m.on('popupopen', () => m.setIcon(icon(d, true)));
  m.on('popupclose', () => m.setIcon(icon(d, false)));
  for (const k of d.sp || []) seenSp[k] = (seenSp[k] || 0) + 1;
  markers.push(m);
}
map.addLayer(cluster);

// ---- filters ------------------------------------------------------------
const spSel = document.getElementById('species');
Object.entries(seenSp).sort((a, b) => b[1] - a[1]).forEach(([k, n]) => {
  const o = document.createElement('option');
  o.value = k; o.textContent = (SPECIES[k] ? SPECIES[k][0] + ' · ' + SPECIES[k][1] : k) + ' (' + n + ')';
  spSel.appendChild(o);
});
const perSel = document.getElementById('period');
const resetBtn = document.getElementById('resetFilters');
const searchInput = document.getElementById('search');
const countEl = document.getElementById('count');
const DEFAULTS = { yes: true, no: true, days: 7, sp: '' };
const FKEY = 'mb-mush-filters';
const flt = Object.assign({}, DEFAULTS);
try { Object.assign(flt, JSON.parse(localStorage.getItem(FKEY) || '{}')); } catch (e) {}
if (!spSel.querySelector('option[value="' + flt.sp + '"]')) flt.sp = '';
function save() { try { localStorage.setItem(FKEY, JSON.stringify(flt)); } catch (e) {} }
function passes(m, nq) {
  const d = m._d;
  if (!(d.grew ? flt.yes : flt.no)) return false;
  if (flt.days && ageDays(d) >= flt.days) return false;
  if (flt.sp && !(d.sp || []).includes(flt.sp)) return false;
  if (nq && !m._hay.includes(nq)) return false;
  return true;
}
function active() { return !flt.yes || !flt.no || flt.days !== DEFAULTS.days || !!flt.sp; }
function applyFilter(fit) {
  const nq = norm(searchInput.value.trim());
  const keep = [], drop = [];
  for (const m of markers) (passes(m, nq) ? keep : drop).push(m);
  cluster.removeLayers(drop);
  cluster.addLayers(keep.filter(m => !cluster.hasLayer(m)));
  const found = keep.filter(m => m._d.grew).length;
  countEl.textContent = keep.length + (keep.length === markers.length ? '' : ' of ' + markers.length) + ' reports · ' + found + ' found';
  for (const b of document.querySelectorAll('.fbtn.kind')) b.setAttribute('aria-pressed', String(!!flt[b.dataset.kind]));
  perSel.value = String(flt.days); perSel.classList.toggle('set', flt.days !== DEFAULTS.days);
  spSel.value = flt.sp; spSel.classList.toggle('set', !!flt.sp);
  resetBtn.hidden = !active();
  if (fit && keep.length) map.fitBounds(L.latLngBounds(keep.map(m => m.getLatLng())), { padding: [50, 50], maxZoom: 11 });
  if (!panel.hidden) renderPanel();
}
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('.fbtn.kind');
  if (!b) return;
  const k = b.dataset.kind, other = k === 'yes' ? 'no' : 'yes';
  flt[k] = !flt[k];
  if (!flt.yes && !flt.no) flt[other] = true;  // never an empty map
  save(); applyFilter(false);
});
perSel.addEventListener('change', () => { flt.days = +perSel.value || 0; save(); applyFilter(false); });
spSel.addEventListener('change', () => { flt.sp = spSel.value; save(); applyFilter(true); });
resetBtn.addEventListener('click', () => { Object.assign(flt, DEFAULTS); save(); applyFilter(true); });
searchInput.addEventListener('input', () => applyFilter(!!searchInput.value.trim()));

// ---- list panel for stacked reports ---------------------------------------
const panel = document.getElementById('panel');
const panelList = document.getElementById('panelList');
let panelMarkers = [], panelFocus = null;
function openPanel(ms, focus) {
  map.closePopup();
  if (typeof closeCond === 'function') closeCond();
  panelMarkers = ms.slice().sort((a, b) => (b._d.date > a._d.date ? 1 : b._d.date < a._d.date ? -1 : 0));
  panelFocus = focus || null;
  panel.hidden = false; document.body.classList.add('panel-open');
  renderPanel();
}
function closePanel() { panel.hidden = true; document.body.classList.remove('panel-open'); panelMarkers = []; }
function renderPanel() {
  const nq = norm(searchInput.value.trim());
  const rows = panelMarkers.filter(m => passes(m, nq) || m === panelFocus);
  const found = rows.filter(m => m._d.grew).length;
  document.getElementById('panelTitle').textContent = rows.length + (rows.length === 1 ? ' report' : ' reports') + ' · ' + found + ' found';
  const areas = {};
  for (const m of panelMarkers) areas[m._d.area] = (areas[m._d.area] || 0) + 1;
  const top = Object.entries(areas).sort((a, b) => b[1] - a[1]);
  document.getElementById('panelWhere').textContent = top.length ? top[0][0] + (top.length > 1 ? ' and nearby' : '') : '';
  panelList.innerHTML = rows.length ? rows.map(m => {
    const d = m._d;
    const dot = '<span class="' + dotCls(d) + '"></span>';
    const thumb = d.img ? '<span class="thumb"><img src="' + attr(d.img) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' + dot + '</span>'
      : '<span class="thumb none">' + dot + '</span>';
    const meta = [fmtDate(d.date), d.user, d.geo === 'area' && d.loc ? 'spot approx.' : ''].filter(Boolean).join(' · ');
    return '<li class="row' + (m === panelFocus ? ' focus' : '') + '" data-id="' + attr(d.id) + '">' + thumb + '<div>'
      + '<div class="row-title">' + esc(title(d)) + '</div><div class="row-meta">' + esc(meta) + '</div>'
      + (d.text ? '<div class="row-text">' + esc(d.text) + '</div>' : '')
      + '<div class="row-links">' + (d.photo ? '<a href="' + attr(d.photo) + '" target="_blank" rel="noopener">photo ↗</a>' : '')
      + '<button type="button" data-open="' + attr(d.id) + '">details</button></div></div></li>';
  }).join('') : '<li class="empty">No reports match the filters.</li>';
  const f = panelList.querySelector('.row.focus');
  if (f) f.scrollIntoView({ block: 'center' }); else panelList.scrollTop = 0;
}
panelList.addEventListener('click', e => {
  const b = e.target.closest('button[data-open]');
  if (!b) return;
  const m = markers.find(x => x._id === b.dataset.open);
  if (m) L.popup({ maxWidth: 300 }).setLatLng(m.getLatLng()).setContent(popupHtml(m._d)).openOn(map);
});
document.getElementById('panelClose').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
map.on('click', closePanel);


// ---- growing conditions (Open-Meteo index, Intersucho, SHMÚ rain maps) -----
const COND = CONF.cond || {};
const REGIONS = COND.regions || [];
const DROUGHT = COND.drought || {};
const RAIN = COND.rain_maps || [];
const condPanel = document.getElementById('cond');
const condBtn = document.getElementById('condBtn');
const hasCond = REGIONS.length || RAIN.length || (DROUGHT.maps || []).length || DROUGHT.summary;
function lvCls(r) { return String(r.label || '').replace(' ', '-'); }
function regionText(r) {
  return [r.label, 'rain 14 d ' + r.rain14_mm + ' mm',
    r.last_soaking_days ? 'last soaking rain ' + r.last_soaking_days + ' d ago' : 'no soaking rain in 3 weeks',
    r.soil_moisture != null ? 'soil ' + r.soil_moisture.toFixed(2) + ' m³/m³' : '',
    r.temp_mean7 != null ? '7-day mean ' + r.temp_mean7 + ' °C' : '',
    r.frost_nights7 ? r.frost_nights7 + ' frosty nights' : '',
    r.rain_next3_mm >= 1 ? r.rain_next3_mm + ' mm rain in the next 3 days' : ''].filter(Boolean).join(' · ');
}
map.createPane('regions');
map.getPane('regions').style.zIndex = 650;  // above the report markers (600)
const rgLayer = L.layerGroup();
for (const r of REGIONS) {
  const m = L.marker([r.lat, r.lon], { icon: L.divIcon({ className: 'mk', iconSize: [0, 0],
    html: '<span class="rg ' + attr(lvCls(r)) + '" title="' + attr(regionText(r)) + '"><i></i>' + esc(r.name) + ' ' + r.score + '</span>' }),
    pane: 'regions', keyboard: false });
  m.on('click', () => openCond());
  rgLayer.addLayer(m);
}
// The area pills show with the conditions panel only (they would hide reports).
function showRegions(on) {
  if (!REGIONS.length) return;
  if (!on) { map.removeLayer(rgLayer); return; }
  rgLayer.addTo(map);
  const phone = window.innerWidth <= 640;
  map.fitBounds(L.latLngBounds(REGIONS.map(r => [r.lat, r.lon])), {
    paddingTopLeft: [50, 50],
    paddingBottomRight: phone ? [30, Math.round(window.innerHeight * 0.72) + 20] : [Math.min(460, window.innerWidth / 2) + 40, 50],
    maxZoom: 9 });
}

function bars(series) {
  const mx = Math.max(10, ...series);
  return '<span class="bars" title="Daily rain, last 14 days (mm): ' + attr(series.join(' · ')) + '">'
    + series.map(v => '<span style="height:' + Math.max(1, Math.round(v / mx * 18)) + 'px"></span>').join('') + '</span>';
}
function shotHtml(url, href, alt) {
  return '<a class="shot" href="' + attr(href || url) + '" target="_blank" rel="noopener"><img src="' + attr(url)
    + '" alt="' + attr(alt) + '" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.outerHTML=\'<p class=note>Map not available any more.</p>\'"></a>';
}
function renderCond() {
  const out = [];
  document.getElementById('condWhere').textContent = COND.date ? 'as of ' + fmtDate(COND.date) : '';
  if (REGIONS.length) {
    out.push('<h3>Mushroom weather</h3><p class="note">Rule-of-thumb index 0–100 per forest area (Open-Meteo): rain of the last 14 days and when the last soaking rain fell (mushrooms follow it by ~4–14 days), topsoil moisture, the 7-day mean temperature (best 10–18 °C) and frosty nights. Good ≥ 70, fair ≥ 45, poor ≥ 25.</p>');
    out.push('<table class="rg-t"><tr><th>Area</th><th class="n">Index</th><th class="n">Rain 14 d</th><th>Daily rain</th><th class="n">°C</th></tr>'
      + REGIONS.slice().sort((a, b) => b.score - a.score).map(r => '<tr title="' + attr(regionText(r)) + '"><td><span class="lv ' + attr(lvCls(r)) + '"></span>' + esc(r.name)
        + '</td><td class="n sc">' + r.score + '</td><td class="n">' + r.rain14_mm + ' mm</td><td>' + bars(r.rain_series || [])
        + '</td><td class="n">' + (r.temp_mean7 != null ? r.temp_mean7 : '–') + (r.frost_nights7 ? ' <span title="frosty nights">❄' + r.frost_nights7 + '</span>' : '') + '</td></tr>').join('')
      + '</table>');
  }
  if (DROUGHT.summary || (DROUGHT.maps || []).length) {
    out.push('<h3>Drought — Intersucho</h3>');
    if (DROUGHT.period) out.push('<p class="note">' + esc(DROUGHT.period) + '</p>');
    for (const s of (DROUGHT.sections || []).slice(0, 3)) {
      const head = s.heading && s.heading !== DROUGHT.period ? '<b>' + esc(s.heading.replace(/:$/, '')) + '.</b> ' : '';
      out.push('<p>' + head + esc(s.text) + '</p>');
    }
    const maps = DROUGHT.maps || [];
    if (maps.length) {
      out.push('<div class="tabs" id="dTabs">' + maps.map((m, i) => '<button type="button" data-i="' + i + '" aria-pressed="' + (i === 1) + '">' + esc(m.label) + '</button>').join('')
        + '</div><div id="dShot">' + shotHtml(maps[Math.min(1, maps.length - 1)].url, maps[Math.min(1, maps.length - 1)].page, 'Intersucho map') + '</div>'
        + '<p class="note">Map of ' + esc(fmtDate(DROUGHT.map_date || '')) + ' · <a class="popup-link" href="' + attr(DROUGHT.source_url || 'https://www.intersucho.sk/sk/') + '" target="_blank" rel="noopener">intersucho.sk ↗</a></p>');
    }
  }
  if (RAIN.length) {
    out.push('<h3>Rain by day — SHMÚ</h3><p class="note">Daily rainfall maps as shown on nahuby.sk “Počasie v uplynulom období”.</p>'
      + '<div class="tabs" id="rTabs">' + RAIN.map((m, i) => '<button type="button" data-i="' + i + '" aria-pressed="' + (i === 0) + '">' + esc(fmtDate(m.date).replace(/ \d{4}$/, '')) + '</button>').join('')
      + '</div><div id="rShot">' + shotHtml(RAIN[0].url, RAIN[0].url, 'SHMÚ rainfall map') + '</div>');
  }
  if (!out.length) out.push('<p class="empty">No condition data today.</p>');
  document.getElementById('condBody').innerHTML = out.join('');
}
document.getElementById('condBody').addEventListener('click', e => {
  const b = e.target.closest('.tabs button');
  if (!b) return;
  const tabs = b.parentNode, i = +b.dataset.i;
  for (const x of tabs.querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
  if (tabs.id === 'dTabs') { const m = DROUGHT.maps[i]; document.getElementById('dShot').innerHTML = shotHtml(m.url, m.page, 'Intersucho map'); }
  else { const m = RAIN[i]; document.getElementById('rShot').innerHTML = shotHtml(m.url, m.url, 'SHMÚ rainfall map'); }
});
function openCond() {
  closePanel(); map.closePopup();
  renderCond();
  condPanel.hidden = false; document.body.classList.add('cond-open'); condBtn.setAttribute('aria-pressed', 'true');
  showRegions(true);
  if (location.hash !== '#conditions') history.replaceState(null, '', '#conditions');
}
function closeCond() {
  if (condPanel.hidden) return;
  condPanel.hidden = true; document.body.classList.remove('cond-open'); condBtn.setAttribute('aria-pressed', 'false');
  showRegions(false);
  if (location.hash === '#conditions') history.replaceState(null, '', location.pathname + location.search);
}
if (hasCond) condBtn.hidden = false;
condBtn.addEventListener('click', () => (condPanel.hidden ? openCond() : closeCond()));
document.getElementById('condClose').addEventListener('click', closeCond);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCond(); });

// ---- deep link #<report id> / #conditions ----------------------------------
function zoomToId(id) {
  if (id === 'conditions') { if (hasCond) { openCond(); return true; } return false; }
  closeCond();
  const m = markers.find(x => x._id === id);
  if (!m) return false;
  if (!passes(m, '')) { Object.assign(flt, DEFAULTS, { days: 0 }); applyFilter(false); }
  map.setView(m.getLatLng(), 13, { animate: false });
  setTimeout(() => {
    const v = cluster.getVisibleParent(m);
    if (!v || v === m) m.openPopup(); else openPanel(v.getAllChildMarkers(), m);
  }, 300);
  return true;
}
applyFilter(false);
window.addEventListener('hashchange', () => zoomToId(decodeURIComponent(location.hash.slice(1))));
if (!zoomToId(decodeURIComponent(location.hash.slice(1)))) {
  if (markers.length) {
    map.fitBounds(L.latLngBounds(markers.map(m => m.getLatLng())), { padding: [40, 40], maxZoom: 9, animate: false });
  }
  // Growing conditions are what the page opens on (2026-11-02, user); a
  // report deep link (#<id>) still goes straight to that report.
  if (hasCond) openCond();
}

function esc(s) { return String(s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function attr(s) { return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }
function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

const KEY = 'mb-theme';
const btn = document.getElementById('themeBtn');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  btn.textContent = t === 'dark' ? '☀︎' : '☾︎';
  applyTiles();
}
let stored = null;
try { stored = localStorage.getItem(KEY); } catch (e) {}
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(stored || (prefersDark ? 'dark' : 'light'));
btn.addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  try { localStorage.setItem(KEY, next); } catch (e) {}
  applyTheme(next);
});
function fitHead() {
  document.documentElement.style.setProperty('--head', document.querySelector('header').offsetHeight + 'px');
  map.invalidateSize();
}
window.addEventListener('resize', fitHead);
fitHead();
// Also published as archive/mushrooms_map.html (archived briefs link to it).
if (location.pathname.indexOf('/archive/') !== -1) {
  document.querySelector('header a.backlink').setAttribute('href', '../index.html');
}
</script>
