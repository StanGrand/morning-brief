<style>
  /* Minimal design (2026-10-29), same tokens and rules as the Daily Brief:
     Graphite neutrals, hairlines instead of shadows, sentence case, one red
     accent. Markers are colour-coded by kind (user request 2026-10-29):
     house red, plot blue, recreational green - the brief's own accent / blue /
     green values for each theme. */
  :root {
    --bg:#fafafa; --card:#ffffff; --ink:#0d0d0d; --muted:#6a6a6a;
    --accent:#d6220d; --border:rgba(0,0,0,.075); --hair:#e6e6e6; --cell:#f4f4f4;
    --house:#d6220d; --plot:#2563b8; --rec:#1a7f4b;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) {
    --bg:#0b0b0b; --card:#151515; --ink:#f5f5f5; --muted:#9b9b9b;
    --accent:#ff4b33; --border:rgba(255,255,255,.08); --hair:#262626; --cell:#1c1c1c;
    --house:#ff4b33; --plot:#60a5fa; --rec:#5ed88a;
  } }
  :root[data-theme="dark"] {
    --bg:#0b0b0b; --card:#151515; --ink:#f5f5f5; --muted:#9b9b9b;
    --accent:#ff4b33; --border:rgba(255,255,255,.08); --hair:#262626; --cell:#1c1c1c;
    --house:#ff4b33; --plot:#60a5fa; --rec:#5ed88a;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font:15px/1.45 var(--body); color:var(--ink); background:var(--bg); overflow:hidden;
    -webkit-font-smoothing:antialiased; }

  /* masthead: the brief's wordmark is the way back */
  header {
    position:fixed; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; flex-wrap:wrap; gap:10px 18px;
    padding:14px max(20px, env(safe-area-inset-right,0px)) 14px max(20px, env(safe-area-inset-left,0px));
    background:var(--bg); border-bottom:1px solid var(--hair);
  }
  .backlink { display:inline-flex; align-items:center; gap:9px; color:var(--ink); text-decoration:none;
    font:600 1.15rem/1.1 var(--body); letter-spacing:-.02em; white-space:nowrap; }
  .backlink:hover { opacity:.75; }
  .brand-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; }
  header h1 { font:400 .95rem/1.2 var(--body); color:var(--muted); margin:0; letter-spacing:0; }
  header h1::before { content:"/"; margin-right:12px; opacity:.5; }
  #search {
    flex:0 1 280px; min-width:140px; margin-left:auto; padding:7px 14px; border-radius:999px;
    border:1px solid var(--hair); background:var(--card); color:var(--ink);
    font:inherit; font-size:.9rem; outline:none; transition:border-color .12s;
  }
  #search::placeholder { color:var(--muted); }
  #search:focus { border-color:var(--ink); }
  #search:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  header .sub { color:var(--muted); font-size:.86rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .theme-btn {
    width:32px; height:32px; border-radius:50%; border:1px solid transparent; padding:0;
    background:transparent; color:var(--muted); cursor:pointer; display:inline-flex;
    align-items:center; justify-content:center; font:400 1rem/1 var(--body);
  }
  .theme-btn:hover { color:var(--ink); border-color:var(--hair); }
  @media (max-width:640px) {
    header { gap:8px 12px; }
    header h1 { display:none; }
    #search { flex:1 1 100%; order:3; margin-left:0; }
    .sub { margin-left:auto; }
  }

  #map { position:fixed; top:var(--head,61px); left:0; right:0; bottom:0; }
  .leaflet-container { background:var(--bg); font:inherit; }

  /* controls: hairline, no shadow */
  .leaflet-bar, .leaflet-touch .leaflet-bar { border:1px solid var(--hair) !important; box-shadow:none !important;
    border-radius:10px; overflow:hidden; }
  .leaflet-bar a, .leaflet-bar a:hover { background:var(--card); color:var(--ink); border-bottom:1px solid var(--hair);
    width:32px; height:32px; line-height:30px; font:400 18px/30px var(--body); }
  .leaflet-bar a:last-child { border-bottom:0; }
  .leaflet-bar a:hover { background:var(--cell); }
  .leaflet-bar a.leaflet-disabled { color:var(--muted); opacity:.5; background:var(--card); }
  .leaflet-control-attribution { font-size:10px !important; background:color-mix(in srgb, var(--bg) 80%, transparent) !important;
    color:var(--muted) !important; }
  .leaflet-control-attribution a { color:var(--muted) !important; }

  /* popups: a small hairline card */
  .leaflet-popup-content-wrapper { border-radius:12px; box-shadow:none; border:1px solid var(--hair);
    background:var(--card); color:var(--ink); }
  .leaflet-popup-tip { background:var(--card); box-shadow:none; border:1px solid var(--hair); }
  .leaflet-popup-content { margin:14px 16px; min-width:210px; max-width:280px; color:var(--ink); line-height:1.4; }
  .leaflet-container a.leaflet-popup-close-button { color:var(--muted); font:400 18px/24px var(--body); width:28px; height:28px; }
  .leaflet-container a.leaflet-popup-close-button:hover { color:var(--ink); }
  .popup-title { font-weight:600; font-size:.95rem; margin:0 18px 4px 0; letter-spacing:-.01em; }
  .popup-meta { color:var(--muted); font-size:.8rem; margin:0 0 10px; }
  .popup-row { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .popup-price { font-weight:600; font-size:1rem; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .popup-price .pm2 { font-weight:400; font-size:.8rem; color:var(--muted); margin-left:6px; }
  .leaflet-container a.popup-link { color:var(--ink); font-size:.86rem; text-decoration:underline;
    text-decoration-color:var(--hair); text-underline-offset:3px; white-space:nowrap; }
  .leaflet-container a.popup-link:hover { text-decoration-color:var(--ink); }

  /* markers: one colour per kind */
  .price-marker { background:transparent !important; border:none !important; }
  .pm { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; transform:translate(-5px,-6px); }
  .pm-dot { width:11px; height:11px; border-radius:50%; flex:none; box-sizing:border-box;
    background:var(--house); border:2px solid var(--card); box-shadow:0 0 0 1px var(--house); }
  .k-plot .pm-dot { background:var(--plot); box-shadow:0 0 0 1px var(--plot); }
  .k-rec .pm-dot { background:var(--rec); box-shadow:0 0 0 1px var(--rec); }
  .pm-price { background:var(--card); color:var(--ink); border:1px solid var(--hair); border-radius:6px;
    padding:1px 5px; font:600 10px/1.4 var(--body); font-variant-numeric:tabular-nums; }
  /* the marker whose popup is open: bigger, ink ring */
  .pm.on .pm-dot { width:15px; height:15px; box-shadow:0 0 0 2px var(--ink); }
  .pm.on .pm-price { border-color:var(--ink); }

  .price-cluster { display:flex; align-items:center; justify-content:center;
    background:var(--card); color:var(--ink); border:1px solid var(--hair); border-radius:50%;
    font:600 12px/1 var(--body); font-variant-numeric:tabular-nums; box-shadow:none; }
  .price-cluster:hover { border-color:var(--ink); }

  .legend {
    position:fixed; bottom:16px; left:16px; z-index:1000;
    background:var(--card); border:1px solid var(--hair); border-radius:10px; padding:8px 12px;
    font-size:.8rem; color:var(--muted); display:flex; align-items:center; gap:14px;
  }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend .pm { transform:none; }
  @media (max-width:640px) { .legend { bottom:22px; left:10px; gap:10px; } }
</style>
</head>

function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

const LIGHT_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}';
const DARK_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}';

// Labels-only layer made for the same canvas (town / village names), drawn
// above the base and below the markers.
const LIGHT_LABELS = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}';
const DARK_LABELS = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}';

let tileLayer = null;
let labelLayer = null;
const map = L.map('map', { zoomControl: true, maxZoom: 18 }).setView([48.20, 17.12], 12);
map.createPane('labels');
map.getPane('labels').style.zIndex = 450;          // above tiles (200), below markers (600)
map.getPane('labels').style.pointerEvents = 'none';
function applyTiles() {
  if (tileLayer) map.removeLayer(tileLayer);
  if (labelLayer) map.removeLayer(labelLayer);
  const dark = isDark();
  tileLayer = L.tileLayer(dark ? DARK_TILES : LIGHT_TILES, {
    maxZoom: 18, maxNativeZoom: 16, minZoom: 9,
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ'
  }).addTo(map);
  labelLayer = L.tileLayer(dark ? DARK_LABELS : LIGHT_LABELS, {
    maxZoom: 18, maxNativeZoom: 16, minZoom: 9, pane: 'labels'
  }).addTo(map);
}
applyTiles();

const markers = [];
function isPlot(d) { return /pozemok|záhrada|zahrada|plot|land/i.test(d.estate_type || ''); }
function priceLabel(p) {
  if (!p) return '';
  if (p >= 1000) return Math.round(p/1000) + 'k €';
  return p + ' €';
}
function kindClass(d) { return d.kind === 'r' ? 'k-rec' : (isPlot(d) ? 'k-plot' : 'k-house'); }
function markerIcon(kind, label) {
  return L.divIcon({
    className: 'price-marker',
    html: '<span class="pm ' + kind + '"><span class="pm-dot"></span>'
      + (label ? '<span class="pm-price">' + label + '</span>' : '') + '</span>',
    iconSize: [0, 0],
    iconAnchor: [7, 10],
    popupAnchor: [0, -12]
  });
}
const cluster = L.markerClusterGroup({
  maxClusterRadius: 40,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true,
  iconCreateFunction: c => {
    const n = c.getChildCount();
    const size = n < 10 ? 30 : n < 100 ? 36 : 42;
    return L.divIcon({
      html: '<span>' + n + '</span>',
      className: 'price-cluster',
      iconSize: [size, size]
    });
  }
});
// Several listings share one geocoded street point, so spread each identical
// coordinate out on a small golden-angle spiral; otherwise only one is visible.
const coordCount = {};
for (const d of DATA) {
  if (d.lat == null || d.lon == null) continue;
  const k = d.lat.toFixed(6) + ',' + d.lon.toFixed(6);
  coordCount[k] = (coordCount[k] || 0) + 1;
}
const coordSeen = {};
const GOLDEN = Math.PI * (3 - Math.sqrt(5));
function spreadLatLon(d) {
  const k = d.lat.toFixed(6) + ',' + d.lon.toFixed(6);
  if (coordCount[k] < 2) return [d.lat, d.lon];
  const i = coordSeen[k] || 0;
  coordSeen[k] = i + 1;
  if (i === 0) return [d.lat, d.lon];
  const r = 0.00007 * Math.sqrt(i);
  const a = i * GOLDEN;
  return [d.lat + r * Math.sin(a),
          d.lon + r * Math.cos(a) / Math.cos(d.lat * Math.PI / 180)];
}
for (const d of DATA) {
  if (d.lat == null || d.lon == null) continue;
  const price = d.price ? (d.price.toLocaleString('sk-SK') + ' €') : 'Price on request';
  const area = d.area ? (Math.round(d.area).toLocaleString('sk-SK') + ' m²') : '';
  const pm2 = (d.price && d.area) ? Math.round(d.price / d.area).toLocaleString('sk-SK') + ' €/m²' : '';
  const meta = [d.location, d.estate_type, d.listed_date, area].filter(Boolean).join(' · ');
  const html = '<div class="popup-title">' + esc(d.title) + '</div>'
    + '<div class="popup-meta">' + esc(meta) + '</div>'
    + '<div class="popup-row"><div class="popup-price">' + price
    + (pm2 ? '<span class="pm2">' + pm2 + '</span>' : '') + '</div>'
    + (d.url ? '<a class="popup-link" href="' + attr(d.url) + '" target="_blank" rel="noopener">Open listing ↗</a>' : '')
    + '</div>';
  const kind = kindClass(d);
  const m = L.marker(spreadLatLon(d), { icon: markerIcon(kind, priceLabel(d.price)) }).bindPopup(html);
  m.on('popupopen', () => { const el = m._icon && m._icon.querySelector('.pm'); if (el) el.classList.add('on'); });
  m.on('popupclose', () => { const el = m._icon && m._icon.querySelector('.pm'); if (el) el.classList.remove('on'); });
  m._id = (d.kind || 'b') + ':' + d.id; m._kind = d.kind || 'b'; m._title = d.title; m._location = d.location; m._isPlot = isPlot(d);
  m._priceLabel = priceLabel(d.price);
  cluster.addLayer(m);
  markers.push(m);
}
map.addLayer(cluster);

// Search filter
const searchInput = document.getElementById('search');
const countEl = document.getElementById('count');
const totalN = markers.length;
function applyFilter(q) {
  const nq = norm(q);
  let shown = 0;
  for (const m of markers) {
    const hay = norm(m._title + ' ' + m._location);
    const show = !nq || hay.includes(nq);
    if (show) { cluster.addLayer(m); shown++; } else { cluster.removeLayer(m); }
  }
  if (countEl) countEl.textContent = nq ? (shown + ' of ' + totalN + ' listings') : (totalN + ' listings');
  if (nq && shown) {
    map.fitBounds(cluster.getBounds(), { padding:[40,40], maxZoom:16 });
  }
}
searchInput.addEventListener('input', e => applyFilter(e.target.value));

// Deep-link: reality_map.html#b:<id> / #r:<id> zooms to that point and opens it.
function zoomToId(id) {
  const m = markers.find(x => x._id === id);
  if (!m) return false;
  map.once('moveend', () => {
    let tries = 0;
    const attempt = () => {
      if (m._map) { m.openPopup(); return; }
      const parent = m.__parent;
      if (parent && parent._icon) {
        cluster.once('spiderfied', () => m.openPopup());
        parent.spiderfy();
      }
      if (++tries < 10) setTimeout(attempt, 250);
    };
    setTimeout(attempt, 250);
  });
  map.setView(m.getLatLng(), 18, { animate: false });
  return true;
}
function handleHash() {
  const id = decodeURIComponent(location.hash.replace(/^#/, ''));
  return id ? zoomToId(id) : false;
}
window.addEventListener('hashchange', handleHash);
if (!handleHash() && markers.length) {
  map.fitBounds(cluster.getBounds(), { padding: [40, 40], maxZoom: 14, animate: false });
}

function esc(s) { return String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function attr(s) { return String(s||'').replace(/"/g,'&quot;'); }
function norm(s) {
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

// Theme handling, shared key with the Daily Brief.
const KEY = 'mb-theme';
const btn = document.getElementById('themeBtn');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  btn.textContent = t === 'dark' ? '☀︎' : '☾︎';
  applyTiles();
}
const stored = localStorage.getItem(KEY);
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(stored || (prefersDark ? 'dark' : 'light'));
btn.addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  localStorage.setItem(KEY, next);
  applyTheme(next);
});

// This page is also published as archive/reality_map.html (so archived briefs
// do not 404); one level up from there the back link needs a ../ prefix.
function fitHead() {
  const h = document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--head', h + 'px');
  map.invalidateSize();
}
window.addEventListener('resize', fitHead);
fitHead();

if (location.pathname.indexOf('/archive/') !== -1) {
  const back = document.querySelector('header a.backlink');
  if (back) back.setAttribute('href', '../index.html');
}
</script>
