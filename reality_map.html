<style>
  :root {
    --bg:#fafafa; --card:#ffffff; --ink:#0d0d0d; --muted:#6a6a6a; --label:#585858;
    --accent:#d6220d; --border:rgba(0,0,0,.08); --cell:#f4f4f4; --radius:14px;
    --plot:#2563b8; --rec:#1a7f4b;
  }
  :root[data-theme="dark"] {
    --bg:#0b0b0b; --card:#151515; --ink:#f5f5f5; --muted:#9b9b9b; --label:#b0b0b0;
    --accent:#ff4b33; --border:rgba(255,255,255,.09); --cell:#1c1c1c;
    --plot:#60a5fa; --rec:#5ed88a;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); overflow:hidden; }
  header {
    position:fixed; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    background:color-mix(in srgb, var(--card) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom:1px solid var(--border);
  }
  header a { color:var(--accent); text-decoration:none; font-weight:600; font-size:13px; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:-.01em; }
  header .sub { color:var(--muted); font-size:12px; margin-left:auto; }
  .theme-btn {
    width:32px; height:32px; border-radius:50%; border:1px solid var(--border);
    background:var(--cell); color:var(--ink); cursor:pointer; display:grid; place-items:center;
    font-size:14px; line-height:1; transition:background .15s, border-color .15s;
  }
  #search {
    flex:0 1 260px; min-width:120px; padding:6px 12px; border-radius:999px;
    border:1px solid var(--border); background:var(--cell); color:var(--ink);
    font:inherit; font-size:13px; outline:none; transition:border-color .12s;
  }
  #search:focus { border-color:var(--accent); }
  @media (max-width:640px) { #search { flex:1 1 100%; order:3; } }
  .theme-btn:hover { border-color:var(--accent); }
  #map { position:fixed; top:52px; left:0; right:0; bottom:0; }
  .leaflet-container { background:var(--bg); font-family:inherit; }
  .leaflet-control-attribution { font-size:10px !important; }
  .popup-title { font-weight:600; font-size:14px; margin:0 0 4px; line-height:1.3; color:var(--ink); }
  .popup-meta { color:var(--muted); font-size:12px; margin:0 0 6px; line-height:1.4; }
  .popup-price { font-weight:600; font-size:13px; margin:0 0 8px; color:var(--ink); }
  .popup-link {
    display:inline-block; color:var(--accent); text-decoration:none; font-weight:600; font-size:13px;
    padding:6px 10px; border-radius:999px; background:var(--cell); transition:background .12s;
  }
  .popup-link:hover { background:var(--accent); color:#fff; }
  .leaflet-popup-content-wrapper { border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.18); border:1px solid var(--border); background:var(--card); color:var(--ink); }
  .leaflet-popup-content { margin:12px 14px; min-width:200px; max-width:280px; color:var(--ink); }
  .leaflet-popup-tip { background:var(--card); border:1px solid var(--border); }
  .price-marker { background:transparent !important; border:none !important; }
  .price-marker .pm-dot {
    display:inline-block; width:10px; height:10px; border-radius:50%;
    border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25);
    vertical-align:middle; margin-right:4px;
  }
  .price-marker .pm-price {
    display:inline-block; background:var(--card); color:var(--ink);
    border:1px solid var(--border); border-radius:6px; padding:1px 5px;
    font-size:10px; font-weight:600; vertical-align:middle;
    box-shadow:0 2px 6px rgba(0,0,0,.15); white-space:nowrap;
  }
  .price-cluster {
    display:flex; align-items:center; justify-content:center;
    background:var(--card); color:var(--ink);
    border:1.5px solid var(--border); border-radius:50%;
    font-size:12px; font-weight:600; letter-spacing:-.01em;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .price-cluster:hover { border-color:var(--accent); color:var(--accent); }
  .legend {
    position:fixed; bottom:16px; left:16px; z-index:1000;
    background:color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border:1px solid var(--border); border-radius:10px; padding:8px 12px;
    font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px;
  }
  .legend .dot {
    width:10px; height:10px; border-radius:50%; background:var(--accent);
    border:2px solid #fff; box-shadow:0 0 0 1px var(--accent);
  }
</style>

const LIGHT_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}';
const DARK_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}';

let tileLayer = null;
const map = L.map('map', { zoomControl: true, maxZoom: 18 }).setView([48.20, 17.12], 12);
function applyTiles() {
  if (tileLayer) map.removeLayer(tileLayer);
  const url = isDark() ? DARK_TILES : LIGHT_TILES;
  tileLayer = L.tileLayer(url, {
    maxZoom: 18, maxNativeZoom: 16, minZoom: 9,
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ'
  }).addTo(map);
}
applyTiles();

const markers = [];
function green() { return getComputedStyle(document.documentElement).getPropertyValue('--rec').trim() || (isDark() ? '#5ed88a' : '#1a7f4b'); }
function plotColor() { return getComputedStyle(document.documentElement).getPropertyValue('--plot').trim() || (isDark() ? '#60a5fa' : '#2563b8'); }
function isPlot(d) { return /pozemok|záhrada|zahrada|plot|land/i.test(d.estate_type || ''); }
function priceLabel(p) {
  if (!p) return '—';
  if (p >= 1000) return Math.round(p/1000) + 'k €';
  return p + ' €';
}
function markerIcon(color, label) {
  return L.divIcon({
    className: 'price-marker',
    html: '<span class="pm-dot" style="background:' + color + '"></span><span class="pm-price">' + label + '</span>',
    iconSize: [0, 0],
    iconAnchor: [7, 10],
    popupAnchor: [0, -12]
  });
}
const cluster = L.markerClusterGroup({
  maxClusterRadius: 40,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true,
  iconCreateFunction: c => {
    const n = c.getChildCount();
    const size = n < 10 ? 30 : n < 100 ? 36 : 42;
    return L.divIcon({
      html: '<span>' + n + '</span>',
      className: 'price-cluster',
      iconSize: [size, size]
    });
  }
});
// Several listings share one geocoded street point, so spread each identical
// coordinate out on a small golden-angle spiral; otherwise only one is visible.
const coordCount = {};
for (const d of DATA) {
  if (d.lat == null || d.lon == null) continue;
  const k = d.lat.toFixed(6) + ',' + d.lon.toFixed(6);
  coordCount[k] = (coordCount[k] || 0) + 1;
}
const coordSeen = {};
const GOLDEN = Math.PI * (3 - Math.sqrt(5));
function spreadLatLon(d) {
  const k = d.lat.toFixed(6) + ',' + d.lon.toFixed(6);
  if (coordCount[k] < 2) return [d.lat, d.lon];
  const i = coordSeen[k] || 0;
  coordSeen[k] = i + 1;
  if (i === 0) return [d.lat, d.lon];
  const r = 0.00007 * Math.sqrt(i);
  const a = i * GOLDEN;
  return [d.lat + r * Math.sin(a),
          d.lon + r * Math.cos(a) / Math.cos(d.lat * Math.PI / 180)];
}
for (const d of DATA) {
  if (d.lat == null || d.lon == null) continue;
  const price = d.price ? (d.price.toLocaleString('sk-SK') + ' €') : '—';
  const area = d.area ? (d.area + ' m²') : '';
  const meta = [d.location, d.estate_type, d.listed_date, area].filter(Boolean).join(' · ');
  const html = '<div class="popup-title">' + esc(d.title) + '</div>'
    + '<div class="popup-meta">' + esc(meta) + '</div>'
    + '<div class="popup-price">' + price + '</div>'
    + (d.url ? '<a class="popup-link" href="' + attr(d.url) + '" target="_blank" rel="noopener">Open listing ↗</a>' : '');
  let fc;
  if (d.kind === 'r') fc = green();
  else fc = isPlot(d) ? plotColor() : accent();
  const m = L.marker(spreadLatLon(d), { icon: markerIcon(fc, priceLabel(d.price)) }).bindPopup(html);
  m._id = (d.kind || 'b') + ':' + d.id; m._kind = d.kind || 'b'; m._title = d.title; m._location = d.location; m._isPlot = isPlot(d);
  m._priceLabel = priceLabel(d.price);
  m._colorOf = () => (m._kind === 'r' ? green() : (m._isPlot ? plotColor() : accent()));
  cluster.addLayer(m);
  markers.push(m);
}
map.addLayer(cluster);

// Search filter
const searchInput = document.getElementById('search');
const countEl = document.getElementById('count');
const totalN = markers.length;
function applyFilter(q) {
  const nq = norm(q);
  let shown = 0;
  for (const m of markers) {
    const hay = norm(m._title + ' ' + m._location);
    const show = !nq || hay.includes(nq);
    if (show) { cluster.addLayer(m); shown++; } else { cluster.removeLayer(m); }
  }
  if (countEl) countEl.textContent = nq ? (shown + ' of ' + totalN + ' listings') : (totalN + ' listings');
  if (nq && shown) {
    map.fitBounds(cluster.getBounds(), { padding:[40,40], maxZoom:16 });
  }
}
searchInput.addEventListener('input', e => applyFilter(e.target.value));

// Deep-link: reality_map.html#b:<id> / #r:<id> zooms to that point and opens it.
function zoomToId(id) {
  const m = markers.find(x => x._id === id);
  if (!m) return false;
  map.once('moveend', () => {
    let tries = 0;
    const attempt = () => {
      if (m._map) { m.openPopup(); return; }
      const parent = m.__parent;
      if (parent && parent._icon) {
        cluster.once('spiderfied', () => m.openPopup());
        parent.spiderfy();
      }
      if (++tries < 10) setTimeout(attempt, 250);
    };
    setTimeout(attempt, 250);
  });
  map.setView(m.getLatLng(), 18, { animate: false });
  return true;
}
function handleHash() {
  const id = decodeURIComponent(location.hash.replace(/^#/, ''));
  return id ? zoomToId(id) : false;
}
window.addEventListener('hashchange', handleHash);
if (!handleHash() && markers.length) {
  map.fitBounds(cluster.getBounds(), { padding: [40, 40], maxZoom: 14, animate: false });
}

function esc(s) { return String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function attr(s) { return String(s||'').replace(/"/g,'&quot;'); }
function norm(s) {
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

// Theme handling, shared key with the Daily Brief.
const KEY = 'mb-theme';
const btn = document.getElementById('themeBtn');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  btn.textContent = t === 'dark' ? '☀' : '☾';
  // recolour markers
  for (const m of markers) m.setIcon(markerIcon(m._colorOf(), m._priceLabel));
  applyTiles();
}
const stored = localStorage.getItem(KEY);
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(stored || (prefersDark ? 'dark' : 'light'));
btn.addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  localStorage.setItem(KEY, next);
  applyTheme(next);
});

// This page is also published as archive/reality_map.html (so archived briefs
// do not 404); one level up from there the back link needs a ../ prefix.
if (location.pathname.indexOf('/archive/') !== -1) {
  const back = document.querySelector('header a');
  if (back) back.setAttribute('href', '../index.html');
}
</script>
</body>
</html>
